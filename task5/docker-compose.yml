services:
  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    image: front-end
    depends_on:
      - back-end

  back-end:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    image: back-end

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: proxy
    ports:
      - 80:80
    depends_on:
      - back-end
      - front-end